<!doctype html>
<html class="bg-gray-50">
  <head>
    <title>%VITE_APP_TITLE%</title>
    <script>
      if (!document.title) document.title = 'Tailscale'
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" type="text/css" href="/src/index.css" />
    <link rel="preload" as="font" href="/src/assets/fonts/Inter.var.latin.woff2" type="font/woff2" crossorigin />
  </head>
  <body class="px-2">
    <noscript>
      <p class="mb-2">You need to enable Javascript to access the %VITE_APP_TITLE% web client.</p>
      <p>If you need any help, feel free to <a href="mailto:%VITE_SUPPORT_EMAIL%" class="link">contact us</a>.</p>
    </noscript>
    <script type="module" src="/src/index.tsx"></script>
    <script>
      // if this script is changed, also change hash in web.go
      window.addEventListener("load", () => {
        if (!window.Tailscale) {
          const rootEl = document.createElement("p")
          rootEl.innerHTML = (document.title || '%VITE_APP_TITLE%') + ' web interface is unavailable.';
          document.body.append(rootEl)
        }
      })
    </script>
  </body>
</html>
